[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipemind-ai"
version = "0.2.0"
description = "Evidence-first read-only hydrogen digital twin and cryogenic planning workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn>=0.35,<1.0",
  "pydantic>=2.9,<3.0",
  "PyJWT[crypto]>=2.8,<3.0",
  "CoolProp>=7.2,<9.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
