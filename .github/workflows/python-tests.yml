name: Screening engine tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run example
        run: PYTHONPATH=src python -m pipemind.cli
