name: PipeMind legacy and screening tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: PYTHONPATH=src:tools python -m unittest discover -s tests -v
        env:
          PIPEMIND_ENV: development
          PIPEMIND_DEV_TOKEN: ci-temporary-test-token-01234567890
          PIPEMIND_DB_PATH: /tmp/pipemind-ci.sqlite
