name: Knowledge retrieval tests

on:
  push:
    branches:
      - "feat/agent-governance"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install platform and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: PYTHONPATH=src:tools python -m unittest discover -s tests -v
        env:
          PIPEMIND_ENV: development
          PIPEMIND_DEV_TOKEN: ci-temporary-test-token-01234567890
          PIPEMIND_DB_PATH: /tmp/pipemind-ci-brain.sqlite
      - name: Smoke test against repository knowledge
        run: python tools/brain_search.py "hydrogen cryogenics" --limit 2
